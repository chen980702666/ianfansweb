  function createRedPacket() {
    const packet = document.createElement("div");
    packet.className = "red-packet";
    packet.innerText = "福";
    packet.style.left = Math.random() * window.innerWidth + "px";
    packet.style.top = "-80px";
    document.body.appendChild(packet);

    // 點擊事件：新分頁抽卡
    packet.addEventListener("click", () => {
      // 開新分頁
      const newWin = window.open("", "_blank");
      // 警告視窗
      newWin.alert("⚠️ 注意：這是紅包抽卡！");

      // 抽卡：隨機抽一張照片
      const randomImg = images[Math.floor(Math.random() * images.length)];

      // 在新分頁顯示抽到的照片
      newWin.document.write(`
        <html>
          <head>
            <title>抽卡結果</title>
            <style>
              body { 
                background: #fff5e6; 
                text-align: center; 
                font-family: sans-serif;
              }
              h1 { color: red; }
              img { 
                max-width: 80%; 
                margin-top: 20px; 
                border: 5px solid gold; 
                border-radius: 10px;
              }
            </style>
          </head>
          <body>
            <h1>🎉 恭喜抽到！</h1>
            <img src="${randomImg}" alt="抽卡結果">
          </body>
        </html>
      `);
    });

    let fall = setInterval(() => {
      let top = parseInt(packet.style.top);
      if (top < window.innerHeight) {
        packet.style.top = top + 5 + "px";
      } else {
        clearInterval(fall);
        packet.remove();
      }
    }, 30);
  }

  document.getElementById("btn").addEventListener("click", () => {
    for (let i = 0; i < 30; i++) {
      setTimeout(createRedPacket, i * 200);
    }
  });
</script>
