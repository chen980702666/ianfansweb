<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>線上麻將</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    canvas { border: 1px solid #333; background: green; }
    #controls { margin-top: 10px; }
    button { margin: 5px; }
  </style>
</head>
<body>
  <canvas id="table" width="800" height="600"></canvas>
  <div id="controls">
    <button onclick="playCard('1萬')">出牌 1萬</button>
    <button onclick="win()">胡</button>
  </div>

  <script>
    const socket = io("http://localhost:3000");
    const canvas = document.getElementById('table');
    const ctx = canvas.getContext('2d');

    let hand = ["1萬","2萬","3萬","5筒","5筒","5筒","東","東","東","南","南","南","白"];
    let roomId = "room1";

    socket.emit('createRoom', roomId);

    socket.on('cardPlayed', (data) => {
      alert(`玩家 ${data.player} 出牌: ${data.card}`);
    });

    socket.on('scoreUpdate', (scores) => {
      console.log("分數更新:", scores);
    });

    function drawTable() {
      ctx.clearRect(0,0,800,600);
      ctx.fillStyle = "green";
      ctx.fillRect(0,0,800,600);

      ctx.fillStyle = "white";
      hand.forEach((card, i) => {
        ctx.fillRect(50 + i*50, 500, 40, 60);
        ctx.fillStyle = "black";
        ctx.fillText(card, 55 + i*50, 530);
        ctx.fillStyle = "white";
      });
    }

    function playCard(card) {
      socket.emit('playCard', { roomId, card });
    }

    function win() {
      socket.emit('win', roomId);
    }

    drawTable();
  </script>
</body>
</html>
